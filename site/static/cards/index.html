<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面试卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: library (book → chapter list) and a one-screen study view with a card stack and thumb buttons. */
:root {
  --bg: #E6EBEE;
  --card: #FFFFFF;
  --ink: #17212A;
  --muted: #5A6974;
  --line: #D2DAE0;
  --accent: #1E6A86;
  --iv: #8A5A12;
  --know: #2B8655;
  --again: #C9434F;
  --code-bg: #EFF3F5;
  --shadow: 0 1px 2px rgba(23,33,42,.06), 0 8px 24px rgba(23,33,42,.08);
  --f-q: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161B; --card: #1A232A; --ink: #E5EBEF; --muted: #92A2AD; --line: #2B3740;
    --accent: #62B4D1; --iv: #E0A85A; --know: #4CC08A; --again: #EE6B78; --code-bg: #222D35;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Library */
.lib { padding-block: calc(18px + env(safe-area-inset-top, 0px)) 32px; display: flex; flex-direction: column; gap: 18px; }
.lib-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lib-top h1 { font-family: var(--f-q); font-size: 26px; margin: 0; }
.lib-top a { color: var(--muted); font-size: 13px; text-decoration: none; }
.lib-note { color: var(--muted); font-size: 13px; margin: -10px 0 0; }
.review {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--again); background: var(--card);
  color: var(--again); cursor: pointer; text-align: left; font-weight: 500;
}
.book { display: flex; flex-direction: column; gap: 10px; }
.book h2 { font-family: var(--f-q); font-size: 19px; margin: 0; }
.book .bsub { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: -8px; }
.ch {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; width: 100%;
  padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
  box-shadow: var(--shadow); cursor: pointer; text-align: left; color: var(--ink);
}
.ch .t { font-weight: 600; font-size: 16px; min-width: 0; }
.ch .t small { color: var(--muted); font-weight: 400; font-family: var(--f-mono); font-size: 12px; margin-right: 6px; }
.ch .go { color: var(--muted); font-size: 18px; }
.ch .m { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch .bar { grid-column: 1 / -1; }
.pill { padding: 0 7px; border-radius: 6px; border: 1px solid var(--line); }
.pill.bk { color: var(--accent); border-color: var(--accent); }
.pill.iv { color: var(--iv); border-color: var(--iv); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .k { background: var(--know); }
.bar .a { background: var(--again); }

/* Study */
.study { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
.st-top { display: flex; align-items: center; gap: 10px; }
.back { border: none; background: none; color: var(--ink); font-size: 20px; padding: 2px 6px 2px 0; cursor: pointer; line-height: 1; }
.st-title { min-width: 0; flex: 1; }
.st-title .bk { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-title .chn { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filters { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: none; background: transparent; color: var(--muted); padding: 4px 11px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.counts { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }

.stage { position: relative; flex: 1; min-height: 0; }
.card {
  position: absolute; inset: 0; background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
  border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform;
}
.card.under { transform: translateY(10px) scale(.955); opacity: .7; pointer-events: none; }
.card.fly { transition: transform .28s ease-in, opacity .28s ease-in; }
.card.back-anim { transition: transform .22s cubic-bezier(.3,1.4,.6,1); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 18px 0; font-size: 12px; color: var(--muted); }
.meta .l { display: flex; gap: 6px; align-items: center; min-width: 0; flex-wrap: wrap; }
.meta .src { color: var(--iv); text-decoration: none; white-space: nowrap; }
.meta .src:hover { text-decoration: underline; }
.status-dot { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.status-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.status-dot.know::before { background: var(--know); }
.status-dot.again::before { background: var(--again); }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px 18px; -webkit-overflow-scrolling: touch; }
.q { font-family: var(--f-q); font-size: 21px; line-height: 1.5; font-weight: 600; text-wrap: balance; margin: 6px 0 0; }
.sub { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.reveal {
  margin-top: 22px; width: 100%; font-size: 14px; padding: 12px; border-radius: 12px;
  border: 1.5px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
.ans { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); user-select: text; -webkit-user-select: text; }
.ans ul, .ans ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.ans p { margin: 0 0 8px; }
.ans b { color: var(--accent); font-weight: 600; }
.ans code { font-family: var(--f-mono); font-size: 13px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ans pre { background: var(--code-bg); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; }
.ans pre code { background: none; padding: 0; font-size: inherit; }
.stamp {
  position: absolute; top: 18px; padding: 4px 12px; border-radius: 8px; border: 2.5px solid currentColor;
  font-weight: 700; font-size: 20px; letter-spacing: .1em; opacity: 0; pointer-events: none; transform: rotate(-8deg);
}
.stamp.k { left: 18px; color: var(--know); }
.stamp.a { right: 18px; color: var(--again); transform: rotate(8deg); }
.hint { text-align: center; font-size: 12px; color: var(--muted); min-height: 1.2em; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.btn {
  font-size: 15px; font-weight: 500; padding: 13px 0; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.again { color: var(--again); border-color: var(--again); }
.btn.know { color: var(--know); border-color: var(--know); }
.btn:disabled { opacity: .4; cursor: default; }
.done {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; background: var(--card); border-radius: 18px; border: 1px solid var(--line); padding: 24px;
}
.done h2 { font-family: var(--f-q); font-size: 22px; margin: 0; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.done .btn { padding: 11px 18px; }
@media (prefers-reduced-motion: reduce) {
  .card.fly, .card.back-anim, .bar i { transition: none; }
}
</style>
<script src="decks.js"></script>
</head>
<body>

<div class="wrap lib" id="lib">
  <div class="lib-top">
    <h1>面试卡片</h1>
    <a href="/">← 笔记站</a>
  </div>
  <p class="lib-note">按书和章节分组。每章分「书本知识」和「面经」两类，进度存在本设备。</p>
  <div id="reviewSlot"></div>
  <div id="books"></div>
</div>

<div class="wrap study" id="study" hidden>
  <div class="st-top">
    <button class="back" id="backBtn" aria-label="返回目录">←</button>
    <div class="st-title">
      <div class="bk" id="stBook"></div>
      <div class="chn" id="stChapter"></div>
    </div>
  </div>
  <div class="bar" aria-hidden="true"><i class="k" id="barK"></i><i class="a" id="barA"></i></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="题型">
      <button id="k-all" data-kind="all" aria-pressed="true">全部</button>
      <button id="k-book" data-kind="book" aria-pressed="false">书本知识</button>
      <button id="k-iv" data-kind="iv" aria-pressed="false">面经</button>
    </div>
    <div class="seg" role="group" aria-label="状态">
      <button id="s-all" data-status="all" aria-pressed="true">全部</button>
      <button id="s-again" data-status="again" aria-pressed="false">不会</button>
      <button id="s-new" data-status="new" aria-pressed="false">未测</button>
    </div>
  </div>
  <div class="counts" id="counts"></div>
  <div class="stage" id="stage"></div>
  <div class="hint" id="hint"></div>
  <div class="controls">
    <button class="btn again" id="bAgain">✕ 不会</button>
    <button class="btn" id="bFlip">看答案</button>
    <button class="btn know" id="bKnow">✓ 会</button>
  </div>
</div>

<script>
const DECKS = window.DECKS || [];
const LS_KEY = "dl-cards-progress-v1";
const KIND_LABEL = { book: "书本知识", iv: "面经" };

// Flatten decks into one card list with book/chapter info attached.
const ALL = [];
const CHAPTERS = {};
for (const book of DECKS) {
  for (const ch of book.chapters) {
    const key = `${book.id}-${ch.no}`;
    CHAPTERS[key] = { key, book, ch };
    for (const c of ch.cards) ALL.push({ ...c, deck: key, book, ch });
  }
}
const BY_ID = Object.fromEntries(ALL.map(c => [c.id, c]));

let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { progress = {}; }

let deck = null;          // chapter key, or "review" for all 不会 cards
let kind = "all";
let status = "all";
let queue = [];
let requeued = new Set();
let revealed = false;
let busy = false;

const $ = (id) => document.getElementById(id);
const statusOf = (id) => progress[id]?.status;

function tally(cards) {
  let k = 0, a = 0;
  for (const c of cards) { const s = statusOf(c.id); if (s === "know") k++; else if (s === "again") a++; }
  return { k, a, n: cards.length };
}
function barHTML(t) {
  const n = t.n || 1;
  return `<div class="bar" aria-hidden="true"><i class="k" style="width:${t.k / n * 100}%"></i><i class="a" style="width:${t.a / n * 100}%"></i></div>`;
}

/* ---------- Library ---------- */
function renderLibrary() {
  const againCards = ALL.filter(c => statusOf(c.id) === "again");
  $("reviewSlot").innerHTML = againCards.length
    ? `<button class="review" id="reviewBtn"><span>刷所有「不会」的卡</span><span>${againCards.length} 张 →</span></button>`
    : "";
  const rb = $("reviewBtn");
  if (rb) rb.addEventListener("click", () => { location.hash = "review"; });

  $("books").innerHTML = DECKS.map(book => `
    <section class="book">
      <h2>${book.title}</h2>
      <div class="bsub">${book.sub}</div>
      ${book.chapters.map(ch => {
        const cards = ch.cards;
        const t = tally(cards);
        const nb = cards.filter(c => c.kind === "book").length;
        const ni = cards.filter(c => c.kind === "iv").length;
        return `<button class="ch" data-deck="${book.id}-${ch.no}">
          <span class="t"><small>第 ${ch.no} 章</small>${ch.title}</span>
          <span class="go">›</span>
          <span class="m"><span class="pill bk">书本知识 ${nb}</span><span class="pill iv">面经 ${ni}</span>
            <span>会 ${t.k} · 不会 ${t.a} · 未测 ${t.n - t.k - t.a}</span></span>
          ${barHTML(t)}
        </button>`;
      }).join("")}
    </section>`).join("");
  for (const b of document.querySelectorAll(".ch")) {
    b.addEventListener("click", () => { location.hash = b.dataset.deck; });
  }
}

/* ---------- Study ---------- */
function pool() {
  if (deck === "review") return ALL.filter(c => statusOf(c.id) === "again");
  return CHAPTERS[deck] ? CHAPTERS[deck].ch.cards.map(c => BY_ID[c.id]) : [];
}

function buildQueue() {
  queue = pool().filter(c => {
    if (kind !== "all" && c.kind !== kind) return false;
    const s = statusOf(c.id);
    if (status === "again") return s === "again";
    if (status === "new") return !s;
    return true;
  }).map(c => c.id);
  requeued = new Set();
  revealed = false;
}

function renderStats() {
  const t = tally(pool());
  $("counts").innerHTML = `会 <b>${t.k}</b> · 不会 <b>${t.a}</b> · 未测 <b>${t.n - t.k - t.a}</b>`;
  const n = t.n || 1;
  $("barK").style.width = (t.k / n * 100) + "%";
  $("barA").style.width = (t.a / n * 100) + "%";
}

function cardHTML(c, isTop) {
  const s = statusOf(c.id);
  const sLabel = s === "know" ? "会" : s === "again" ? "不会" : "未测";
  const where = deck === "review" ? `<span>${c.book.title} · 第 ${c.ch.no} 章</span>` : "";
  return `
    <div class="meta">
      <span class="l">${where}<span class="pill ${c.kind === "iv" ? "iv" : "bk"}">${KIND_LABEL[c.kind]}</span><span>${c.ref}</span>${c.src ? `<a class="src" href="${c.src}" target="_blank" rel="noopener">原帖 ↗</a>` : ""}</span>
      <span class="status-dot ${s || ""}">${sLabel}</span>
    </div>
    <div class="body">
      <p class="q">${c.q}</p>
      ${c.sub ? `<p class="sub">${c.sub}</p>` : ""}
      ${isTop && revealed ? `<div class="ans">${c.a}</div>` : (isTop ? `<button class="reveal" id="revealBtn">先自己答一遍，再点这里看答案</button>` : "")}
    </div>
    ${isTop ? `<div class="stamp k">会</div><div class="stamp a">不会</div>` : ""}`;
}

function renderStudy() {
  const stage = $("stage");
  stage.innerHTML = "";
  const left = queue.length;
  $("bAgain").disabled = $("bKnow").disabled = $("bFlip").disabled = left === 0;
  $("bFlip").textContent = revealed ? "收起答案" : "看答案";
  if (left === 0) {
    const filtered = kind !== "all" || status !== "all";
    const hasAgain = deck !== "review" && pool().some(c => statusOf(c.id) === "again");
    const d = document.createElement("div");
    d.className = "done";
    d.innerHTML = `<h2>${filtered || deck === "review" ? "这里空了" : "这一轮刷完了"}</h2>
      <p>${deck === "review" ? "「不会」的卡都刷完了。" : filtered ? "当前筛选下没有卡片。" : "「不会」的卡片明天再刷一遍，记得更牢。"}</p>
      <div class="row">
        ${hasAgain ? `<button class="btn again" data-go="again">只刷不会的</button>` : ""}
        ${deck === "review" ? "" : `<button class="btn" data-go="all">全部重来</button>`}
        <button class="btn" data-go="home">回目录</button>
      </div>`;
    d.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]")?.dataset.go;
      if (go === "home") location.hash = "";
      else if (go === "again") { kind = "all"; setStatus("again"); }
      else if (go === "all") { kind = "all"; setStatus("all"); }
    });
    stage.appendChild(d);
    $("hint").textContent = "";
    return;
  }
  $("hint").textContent = `剩 ${left} 张 · 点卡片看答案 · 右滑 会 · 左滑 不会`;
  if (left > 1) {
    const u = document.createElement("div");
    u.className = "card under";
    u.innerHTML = cardHTML(BY_ID[queue[1]], false);
    stage.appendChild(u);
  }
  const t = document.createElement("div");
  t.className = "card";
  t.id = "topCard";
  t.innerHTML = cardHTML(BY_ID[queue[0]], true);
  stage.appendChild(t);
  attachSwipe(t);
  const rb = $("revealBtn");
  if (rb) rb.addEventListener("click", (e) => { e.stopPropagation(); toggleReveal(); });
}

function toggleReveal() {
  if (!queue.length || busy) return;
  revealed = !revealed;
  renderStudy();
}

function save(id, s) {
  progress[id] = { status: s, last: new Date().toISOString() };
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
}

function decide(s) {
  if (!queue.length || busy) return;
  const t = $("topCard");
  const id = queue[0];
  busy = true;
  save(id, s);
  const dir = s === "know" ? 1 : -1;
  t.querySelector(s === "know" ? ".stamp.k" : ".stamp.a").style.opacity = 1;
  t.classList.add("fly");
  t.style.transform = `translateX(${dir * 130}%) rotate(${dir * 18}deg)`;
  t.style.opacity = 0;
  setTimeout(() => {
    queue.shift();
    if (s === "again" && !requeued.has(id)) { requeued.add(id); queue.push(id); }
    revealed = false;
    busy = false;
    renderStats();
    renderStudy();
  }, 260);
}

function attachSwipe(el) {
  let sx = 0, sy = 0, dx = 0, dragging = false, decided = false, pid = null, t0 = 0;
  const sk = el.querySelector(".stamp.k"), sa = el.querySelector(".stamp.a");
  el.addEventListener("pointerdown", (e) => {
    if (busy || e.button > 0) return;
    sx = e.clientX; sy = e.clientY; dx = 0; dragging = false; decided = false; pid = e.pointerId; t0 = Date.now();
    el.classList.remove("back-anim");
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pid || busy) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      dragging = Math.abs(mx) > Math.abs(my);
      if (dragging) { try { el.setPointerCapture(pid); } catch (err) {} }
    }
    if (!dragging) return;
    dx = mx;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    const p = Math.min(Math.abs(dx) / 100, 1);
    sk.style.opacity = dx > 0 ? p : 0;
    sa.style.opacity = dx < 0 ? p : 0;
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (dragging) {
      if (Math.abs(dx) > 90) { decide(dx > 0 ? "know" : "again"); return; }
      el.classList.add("back-anim");
      el.style.transform = "";
      sk.style.opacity = sa.style.opacity = 0;
    } else if (!decided && e.type === "pointerup" && Date.now() - t0 < 350 && !revealed) {
      if (!e.target.closest("button, a, pre")) toggleReveal();
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function syncSegs() {
  for (const b of document.querySelectorAll("[data-kind]")) b.setAttribute("aria-pressed", String(b.dataset.kind === kind));
  for (const b of document.querySelectorAll("[data-status]")) b.setAttribute("aria-pressed", String(b.dataset.status === status));
}
function setKind(k) { kind = k; syncSegs(); buildQueue(); renderStudy(); }
function setStatus(s) { status = s; syncSegs(); buildQueue(); renderStudy(); }

for (const b of document.querySelectorAll("[data-kind]")) b.addEventListener("click", () => setKind(b.dataset.kind));
for (const b of document.querySelectorAll("[data-status]")) b.addEventListener("click", () => setStatus(b.dataset.status));
$("bAgain").addEventListener("click", () => decide("again"));
$("bKnow").addEventListener("click", () => decide("know"));
$("bFlip").addEventListener("click", toggleReveal);
$("backBtn").addEventListener("click", () => { location.hash = ""; });
document.addEventListener("keydown", (e) => {
  if ($("study").hidden) return;
  if (e.key === "ArrowRight") decide("know");
  else if (e.key === "ArrowLeft") decide("again");
  else if (e.key === "Escape") location.hash = "";
  else if ((e.key === " " || e.key === "Enter") && !e.target.closest("button")) { e.preventDefault(); toggleReveal(); }
});

/* ---------- Routing: #<book>-<chapter> or #review ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "review" || CHAPTERS[h]) {
    deck = h;
    kind = "all";
    status = "all";
    if (h === "review") {
      $("stBook").textContent = "全部书";
      $("stChapter").textContent = "所有「不会」的卡";
    } else {
      const { book, ch } = CHAPTERS[h];
      $("stBook").textContent = book.title;
      $("stChapter").textContent = `第 ${ch.no} 章 · ${ch.title}`;
    }
    document.body.style.overflow = "hidden";
    $("lib").hidden = true;
    $("study").hidden = false;
    syncSegs();
    buildQueue();
    renderStats();
    renderStudy();
  } else {
    deck = null;
    document.body.style.overflow = "";
    $("study").hidden = true;
    $("lib").hidden = false;
    renderLibrary();
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
