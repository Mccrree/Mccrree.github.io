  { id: "c4-01", no: "4.1", src: "书 4.2",
    q: "去掉激活函数，多层网络会变成什么？为什么？",

      <li>表达能力来自<b>激活函数的非线性</b>。ReLU 网络是「分段线性」函数，每个 ReLU 在一个位置把函数折一下。</li></ul>` },

  { id: "c4-03", no: "4.3", src: "书 4.1",

    a: `<ul>
      <li>第一层把输入空间<b>折叠</b>到自己身上：斜率正负交替时，多个不同的 x 被映射到同一个 y。</li>
      <li>第二层在折叠后的空间上施加函数，展开后这个函数在每一折上<b>被复制一遍</b>（还会翻转、缩放）。</li>
      <li>例子：3 个区域 × 3 个区域 = <b>9 个区域</b>；同样 6 个隐藏单元的浅层网络最多只有 7 个。</li>
      <li>另一个视角：每层 ReLU 把函数在多处剪到 0，制造新的拐点。</li></ul>` },
  { id: "c4-04", no: "4.4", src: "书 4.3.1",
    q: "宽度、深度、容量、超参数分别是什么？超参数和参数有什么区别？",
    a: `<ul>
      <li><b>宽度</b>：每层隐藏单元数　<b>深度</b>：隐藏层数　<b>容量</b>：隐藏单元总数</li>
      <li><b>超参数</b>：训练前定好的，比如层数 K、每层宽度 Dₖ、学习率</li>
      <li><b>参数</b>：训练学出来的，即权重 Ω 和偏置 β</li>
      <li>一组超参数定义一个<b>函数族</b>，一组具体参数确定族里的<b>某一个函数</b>。</li></ul>` },
  { id: "c4-05", no: "4.5", src: "习题 4.4",
    q: "输入 5 维，隐藏层 20、10、7，输出 4 维。每个 Ω 和 β 的形状？总参数量？",
    a: `<ul>
      <li>规则：Ωₖ 的形状 = <b>下一层维度 × 这一层维度</b>，βₖ 的长度 = 下一层维度</li>
      <li>Ω₀ 20×5，Ω₁ 10×20，Ω₂ 7×10，Ω₃ 4×7</li>
      <li>β₀ 20，β₁ 10，β₂ 7，β₃ 4</li>
      <li>权重 100 + 200 + 70 + 28 = 398，偏置 41，<b>总共 439</b></li></ul>` },
  { id: "c4-06", no: "4.6", src: "书 4.5.2",
    q: "1 维输入、1 维输出时，浅层和深层网络最多各能有多少个线性区域？",
    a: `<ul>
      <li><b>浅层</b>：D 个隐藏单元 → 最多 <b>D + 1</b> 个区域，参数 3D + 1 个</li>
      <li><b>深层</b>：K 层、每层 D 个 → 最多 <b>(D + 1)ᴷ</b> 个区域，参数 3D + 1 + (K−1)D(D+1) 个</li>
      <li>区域数随深度<b>指数</b>增长，参数只<b>线性</b>增长。例子：K=5、D=10，471 个参数，161,051 个区域。</li></ul>` },
  { id: "c4-07", no: "4.7", src: "书 4.5.3",
    q: "什么是深度效率？线性区域多一定是好事吗？",
    a: `<ul>
      <li><b>深度效率</b>：有些函数，浅层网络要<b>指数级更多</b>的隐藏单元，才能达到深层网络的逼近效果。</li>
      <li><b>区域多不一定好</b>：区域是「折叠复制」出来的，彼此有复杂的<b>依赖和对称</b>，不能各自独立调整。</li>
      <li>只有真实问题本身有这种对称或组合结构时，区域多才是优势。书里说这一点<b>目前还不清楚</b>。</li></ul>` },
  { id: "c4-08", no: "4.8", src: "书 4.5.4",
    q: "为什么全连接网络不适合处理图像？",
    a: `<ol>
      <li><b>参数太多</b>：一张图约 10⁶ 个像素，全连接参数量爆炸。</li>

      <p style="margin-top:8px">解决：先<b>并行处理局部区域</b>，再逐层整合更大范围（<b>从局部到全局</b>），也就是 CNN（第 10 章）。</p>` },
  { id: "c4-09", no: "4.9", src: "习题 4.6",
    q: "1 维输入输出、K = 10 层、每层 D = 10。加一层 vs 每层加 1 个单元，哪个权重涨得多？",
    a: `<ul>

  { id: "c4-10", no: "4.10", src: "书 4.6",
    q: "深层网络相比浅层网络，本章得出了哪 5 个结论？",
    a: `<ol>
      <li>容量足够时，<b>两者都能逼近任意连续函数</b>（通用逼近定理）</li>
      <li>深层网络<b>每个参数产生更多线性区域</b></li>
      <li>有些函数用深层网络逼近<b>更高效</b>（深度效率）</li>
      <li>图像等<b>大型结构化输入</b>更适合多阶段处理</li>
      <li>实践中<b>深层效果最好</b>：中等深度更好训练、泛化更好，但原因还没完全搞清楚</li></ol>` },
  { id: "c4-11", no: "4.11", src: "面试", iv: true,
    q: "为什么需要非线性激活？ReLU、sigmoid、tanh 各有什么优缺点？",
    sub: "追问：ReLU 有什么问题？怎么解决？",
    a: `<ul>
      <li><b>为什么需要</b>：没有非线性，多层等于一层。</li>
      <li><b>sigmoid</b>：输出 (0,1)；导数最大 0.25，层多了<b>梯度消失</b>；不以 0 为中心；指数运算慢。现在主要用在二分类输出层。</li>
      <li><b>tanh</b>：输出 (−1,1)，<b>以 0 为中心</b>，但两端仍饱和，也会梯度消失。</li>
      <li><b>ReLU</b>：max(0,x)。正区间梯度恒为 1，<b>不会梯度消失</b>，计算快，输出稀疏。</li>
      <li><b>Dead ReLU</b>：输入一直为负 → 梯度一直为 0 → 神经元永远不更新。诱因：学习率太大、初始化不好。</li>
      <li><b>缓解</b>：Leaky ReLU（负区间小斜率，如 0.01x）、调小学习率、He 初始化。</li>
      <li>追问「0 点不可导」：实现里取 0 当梯度（次梯度）。</li></ul>` },
  { id: "c4-12", no: "4.12", src: "面试", iv: true,
    q: "神经网络是不是越深越好？",

    a: `<ul>
      <li><b>不是</b>。中等深度比浅层好训练，再继续加深训练又变难。</li>

      <li><b>退化问题</b>：更深的网络连<b>训练误差</b>都更高，所以<b>不是过拟合</b>，是优化困难。</li>
      <li><b>解决</b>：残差连接（ResNet，第 11 章）、BatchNorm、Xavier / He 初始化、梯度裁剪。</li>

model = MLP()

      <li>参数量：8320 + 8256 + 65 = <b>16,641</b></li>
      <li>追问：为什么用 <code>BCEWithLogitsLoss</code>？sigmoid 和 log 合在一起<b>数值更稳定</b>，避免 log(0)。</li>
      <li>顺序记牢：前向 → loss → <code>zero_grad</code> → <code>backward</code> → <code>step</code></li></ul>` },
  { id: "c4-15", no: "4.15", src: "书 4.7 笔记", iv: true,
    q: "「深度学习」这个词 1986 年就有了，为什么到 2012 年才爆发？",
    a: `<p>之前<b>训练不起来</b>。2012 年 AlexNet 在图像分类上大幅领先，背后 4 个因素同时到位：</p>
      <ol><li><b>更大的数据集</b></li><li><b>更强的算力</b>（GPU）</li><li><b>ReLU 激活函数</b></li><li><b>随机梯度下降（SGD）</b></li></ol>` },
];

const LS_KEY = "dl-cards-progress-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { progress = {}; }

let filter = "all";
let queue = [];
let requeued = new Set();
let revealed = false;
let busy = false;
let db = null;
const writeChains = {};

const $ = (id) => document.getElementById(id);
const stage = $("stage");

function buildQueue() {
  queue = CARDS.filter(c => {
    const s = progress[c.id]?.status;
    if (filter === "again") return s === "again";
    if (filter === "new") return !s;
    return true;
  }).map(c => c.id);
  requeued = new Set();
  revealed = false;
}

function renderStats() {
  let k = 0, a = 0;
  for (const c of CARDS) {
    const s = progress[c.id]?.status;
    if (s === "know") k++; else if (s === "again") a++;
  }
  const n = CARDS.length;
  $("counts").innerHTML = `会 <b>${k}</b> · 不会 <b>${a}</b> · 未测 <b>${n - k - a}</b>`;
  $("barK").style.width = (k / n * 100) + "%";
  $("barA").style.width = (a / n * 100) + "%";
}

function cardHTML(c, isTop) {
  const s = progress[c.id]?.status;
  const sLabel = s === "know" ? "会" : s === "again" ? "不会" : "未测";
  return `
    <div class="meta">
      <span>${c.no}　<span class="tag${c.iv ? " iv" : ""}">${c.src}</span></span>
      <span class="status-dot ${s || ""}">${sLabel}</span>
    </div>
    <div class="body">
      <p class="q">${c.q}</p>
      ${c.sub ? `<p class="sub">${c.sub}</p>` : ""}
      ${isTop && revealed ? `<div class="ans">${c.a}</div>` : (isTop ? `<button class="reveal" id="revealBtn">先自己答一遍，再点这里看答案</button>` : "")}
    </div>
    ${isTop ? `<div class="stamp k">会</div><div class="stamp a">不会</div>` : ""}`;
}

function render() {
  stage.innerHTML = "";
  const left = queue.length;
  $("bAgain").disabled = $("bKnow").disabled = $("bFlip").disabled = left === 0;
  $("bFlip").textContent = revealed ? "收起答案" : "看答案";
  if (left === 0) {
    const empty = filter === "again" ? "现在没有「不会」的卡片。" : filter === "new" ? "所有卡片都测过了。" : "";
    const hasAgain = CARDS.some(c => progress[c.id]?.status === "again");
    const d = document.createElement("div");
    d.className = "done";
    d.innerHTML = `<h2>${empty ? "这里空了" : "这一轮刷完了"}</h2>
      <p>${empty || "「不会」的卡片明天再刷一遍，记得更牢。"}</p>
      <div class="row">
        ${hasAgain ? `<button class="btn again" data-go="again">只刷不会的</button>` : ""}
        <button class="btn" data-go="all">全部重来</button>
      </div>`;
    d.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]")?.dataset.go;
      if (go) setFilter(go);
    });
    stage.appendChild(d);
    $("hint").textContent = "";
    return;
  }
  $("hint").textContent = `剩 ${left} 张 · 点卡片看答案 · 右滑 会 · 左滑 不会`;
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  if (left > 1) {
    const u = document.createElement("div");
    u.className = "card under";
    u.innerHTML = cardHTML(byId[queue[1]], false);
    stage.appendChild(u);
  }
  const t = document.createElement("div");
  t.className = "card";
  t.id = "topCard";
  t.innerHTML = cardHTML(byId[queue[0]], true);
  stage.appendChild(t);
  attachSwipe(t);
  const rb = $("revealBtn");
  if (rb) rb.addEventListener("click", (e) => { e.stopPropagation(); toggleReveal(); });
}

function toggleReveal() {
  if (!queue.length || busy) return;
  revealed = !revealed;
  render();
}

function save(id, status) {
  progress[id] = { status, last: new Date().toISOString() };
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
  if (!db) return;
  const card = CARDS.find(c => c.id === id);
  const body = { status, no: card.no, last: progress[id].last };
  writeChains[id] = (writeChains[id] || Promise.resolve())
    .then(() => db.collection("progress").doc(id).set(body))
    .catch(() => { $("sync").textContent = "同步失败，已存本机"; });
}

function decide(status) {
  if (!queue.length || busy) return;
  const t = $("topCard");
  const id = queue[0];
  busy = true;
  save(id, status);
  const dir = status === "know" ? 1 : -1;
  t.querySelector(status === "know" ? ".stamp.k" : ".stamp.a").style.opacity = 1;
  t.classList.add("fly");
  t.style.transform = `translateX(${dir * 130}%) rotate(${dir * 18}deg)`;
  t.style.opacity = 0;
  setTimeout(() => {
    queue.shift();
    if (status === "again" && !requeued.has(id)) { requeued.add(id); queue.push(id); }
    revealed = false;
    busy = false;
    renderStats();
    render();
  }, 260);
}

function attachSwipe(el) {
  let sx = 0, sy = 0, dx = 0, dragging = false, decided = false, pid = null, t0 = 0;
  const sk = el.querySelector(".stamp.k"), sa = el.querySelector(".stamp.a");
  el.addEventListener("pointerdown", (e) => {
    if (busy || e.button > 0) return;
    sx = e.clientX; sy = e.clientY; dx = 0; dragging = false; decided = false; pid = e.pointerId; t0 = Date.now();
    el.classList.remove("back");
  });
  el.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pid || busy) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      dragging = Math.abs(mx) > Math.abs(my);
      if (dragging) { try { el.setPointerCapture(pid); } catch (err) {} }
    }
    if (!dragging) return;
    dx = mx;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    const p = Math.min(Math.abs(dx) / 100, 1);
    sk.style.opacity = dx > 0 ? p : 0;
    sa.style.opacity = dx < 0 ? p : 0;
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (dragging) {
      if (Math.abs(dx) > 90) { decide(dx > 0 ? "know" : "again"); return; }
      el.classList.add("back");
      el.style.transform = "";
      sk.style.opacity = sa.style.opacity = 0;
    } else if (!decided && e.type === "pointerup" && Date.now() - t0 < 350 && !revealed) {
      if (!e.target.closest("button, a, pre")) toggleReveal();
    }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function setFilter(f) {
  filter = f;
  for (const b of document.querySelectorAll(".chip")) b.setAttribute("aria-pressed", String(b.dataset.f === f));
  buildQueue();
  render();
}

for (const b of document.querySelectorAll(".chip")) b.addEventListener("click", () => setFilter(b.dataset.f));
$("bAgain").addEventListener("click", () => decide("again"));
$("bKnow").addEventListener("click", () => decide("know"));
$("bFlip").addEventListener("click", toggleReveal);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") decide("know");
  else if (e.key === "ArrowLeft") decide("again");
  else if (e.key === " " || e.key === "Enter") { if (!e.target.closest("button")) { e.preventDefault(); toggleReveal(); } }
});

buildQueue();
renderStats();
render();

(async () => {
  const use = window.claude && window.claude.use;
  db = use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { $("sync").textContent = "进度存在本设备"; return; }
  let gotServer = false;
  const timer = setTimeout(() => { if (!gotServer) $("sync").textContent = "暂时连不上，已存本机"; }, 10000);
  db.collection("progress").onSnapshot((snap) => {
    const remote = {};
    for (const d of snap.docs) {
      const v = d.data();
      if (v && (v.status === "know" || v.status === "again")) remote[d.id] = { status: v.status, last: v.last };
    }
    for (const [id, v] of Object.entries(remote)) {
      const mine = progress[id];
      if (!mine || (v.last || "") >= (mine.last || "")) progress[id] = v;
    }
    try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
    if (!snap.metadata.fromCache) { gotServer = true; clearTimeout(timer); $("sync").textContent = "已同步"; }
    renderStats();
    if (!busy && !revealed) render();
  }, () => { clearTimeout(timer); $("sync").textContent = "同步失败，已存本机"; });
})();
</script>
</body>
</html>
